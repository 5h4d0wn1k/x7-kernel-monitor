[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "kmon"
version = "1.0.0"
description = "X7 — Production-grade Linux kernel/system monitor (detection-only, own-machines)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "5h4d0wn1k", email = "5h4d0wn1k@users.noreply.github.com"},
]

[project.scripts]
kmon = "kmon.cli:main"

[tool.setuptools.packages.find]
include = ["kmon*"]
